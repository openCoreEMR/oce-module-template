name: PHPStan

on:
  push:
    branches:
    - main
    paths:
    - '**.php'
    - phpstan.neon
    - phpstan.neon.dist
    - phpstan-baseline.neon
    - composer.json
    - composer.lock
    - .github/workflows/phpstan.yml
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  phpstan:
    if: ${{ !github.event.repository.is_template }}
    strategy:
      matrix:
        php-version: ['8.5']
    uses: openCoreEMR/github-workflows-public/.github/workflows/php-composer-script.yml@1.0.0
    with:
      name: Run PHPStan
      run: composer phpstan
      php-version: ${{ matrix.php-version }}
      # `composer phpstan` installs tools/openemr, which now pins the private
      # openemr-internal oce-810 core (the 8.1 CsrfUtils signature). Mint an App
      # token so `composer install` can clone it.
      private-repos: openemr-internal
    secrets:
      app-id: ${{ secrets.OPENEMR_INTERNAL_CLIENT_ID }}
      app-private-key: ${{ secrets.OPENEMR_INTERNAL_APP_PRIVATE_KEY }}
